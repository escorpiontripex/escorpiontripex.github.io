<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Pac-Man</title>
<style>
  body {
    background: black;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
  }
  canvas {
    background: #000;
    display: block;
    margin: 20px auto;
    border: 2px solid yellow;
  }
</style>
</head>
<body>

<h1>🟡 Mini Pac-Man</h1>
<p>Usa las flechas del teclado</p>

<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const tile = 20;
const rows = 20;
const cols = 20;

// 0 = vacío, 1 = pared, 2 = punto
let map = Array.from({ length: rows }, () =>
  Array.from({ length: cols }, () => Math.random() > 0.2 ? 2 : 1)
);

// jugador
let pacman = { x: 1, y: 1, dx: 0, dy: 0 };
let score = 0;

// controles
document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") { pacman.dx = 0; pacman.dy = -1; }
  if (e.key === "ArrowDown") { pacman.dx = 0; pacman.dy = 1; }
  if (e.key === "ArrowLeft") { pacman.dx = -1; pacman.dy = 0; }
  if (e.key === "ArrowRight") { pacman.dx = 1; pacman.dy = 0; }
});

// dibujar mapa
function drawMap() {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (map[y][x] === 1) {
        ctx.fillStyle = "blue";
        ctx.fillRect(x * tile, y * tile, tile, tile);
      }
      if (map[y][x] === 2) {
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(x * tile + tile/2, y * tile + tile/2, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

// dibujar pacman
function drawPacman() {
  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(
    pacman.x * tile + tile/2,
    pacman.y * tile + tile/2,
    tile/2,
    0,
    Math.PI * 2
  );
  ctx.fill();
}

// mover pacman
function movePacman() {
  let nx = pacman.x + pacman.dx;
  let ny = pacman.y + pacman.dy;

  if (map[ny] && map[ny][nx] !== 1) {
    pacman.x = nx;
    pacman.y = ny;

    if (map[ny][nx] === 2) {
      map[ny][nx] = 0;
      score++;
    }
  }
}

// loop
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawMap();
  movePacman();
  drawPacman();

  ctx.fillStyle = "white";
  ctx.fillText("Score: " + score, 10, 10);

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
